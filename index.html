
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weekly Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container py-5">
        <div class="planner-container">
            <header class="header">
                <span class="subtitle">YOUR PERSONAL SPACE</span>
                <h1>My Weekly Planner <span>✦</span></h1>
                <p>Plan your week, one step at a time.</p>
            </header>

            <section class="week-section">
                <div class="section-heading">
                    <h2>This week</h2>
                    <input type="date" id="weekDate" class="form-control date-input">
                </div>
                <div id="weekDays" class="week-days"></div>
            </section>

            <section class="tasks-section">
                <div class="section-heading">
                    <h2 id="selectedDayTitle">My tasks</h2>
                    <span id="taskCounter">0 tasks</span>
                </div>

                <div class="progress-info">
                    <span>Daily progress</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress mb-4">
                    <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                </div>

                <form id="taskForm" class="task-form">
                    <input type="text" id="taskInput" class="form-control" placeholder="What needs to be done?" required>
                    <select id="priorityInput" class="form-select">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                    <button class="btn btn-primary" type="submit">ADD</button>
                </form>

                <ul id="taskList" class="list-group"></ul>
            </section>

            <footer class="footer-text">MAKE EVERY DAY COUNT</footer>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
